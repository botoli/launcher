[workspace]
members = [
    "apps/desktop",
    "crates/launcher-core",
    "crates/shared",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.25"

[workspace.dependencies]
launcher-core = { path = "crates/launcher-core" }
launcher-shared = { path = "crates/shared" }
slint = "1.17.1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.dependencies.slint-build]
version = "1.17.1"
